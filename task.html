<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="App for managing team, event, task, and see it's completion progress" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Team & Event Management</title>
  </head>
  <body>
    <nav>
      <ul class="flex justify-between items-center px-2 pt-2">
        <li><a href="./dashboard.html"> Dashboard </a></li>
        <li><a href="#"> Anggota </a></li>
        <li><a href="#"> Event </a></li>
        <li><a href="./task.html"> Tugas </a></li>
      </ul>
    </nav>
    <header><h1 class="text-lg p-2">Task List</h1></header>
    <main class="p-2">
      <div class="relative w-full overflow-x-auto">
        <table class="w-full caption-bottom text-sm">
          <thead class="[&_tr]:border-b">
            <tr class="border-b transition-colors hover:bg-muted/50 has-aria-expanded:bg-muted/50 data-[state=selected]:bg-muted">
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Nama Tugas
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Deskripsi
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Deadline
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Status
              </th>
            </tr>
          </thead>
          <tbody class="[&_tr:last-child]:border-0">
            <tr class="border-b transition-colors hover:bg-muted/50 has-aria-expanded:bg-muted/50 data-[state=selected]:bg-muted">
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Task 1</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Deskripsi Task 1</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">2023-12-31</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Belum Selesai</td>
            </tr>
            <tr class="border-b transition-colors hover:bg-muted/50 has-aria-expanded:bg-muted/50 data-[state=selected]:bg-muted">
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Task 2</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Deskripsi Task 2</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">2023-12-31</td>
              <td class="p-2 align-middle whitespace-nowrap has-[[role=checkbox]]:pr-0">Selesai</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
