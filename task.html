<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="App for managing team, event, task, and see it's completion progress" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Team & Event Management</title>
  </head>
  <body>
    <nav class="px-2 pt-2">
      <ul class="justify-between items-center flex">
        <li><a href="./dashboard.html"> Dashboard </a></li>
        <li><a href="#"> Anggota </a></li>
        <li><a href="#"> Event </a></li>
        <li><a href="./task.html"> Tugas </a></li>
      </ul>
    </nav>
    <header class="flex px-2 pt-2 justify-between items-center">
      <h1 class="text-2xl font-bold">Task List</h1>
      <button id="toggle-form-btn" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">
        + Tambah Tugas
      </button>
    </header>
    <main class="p-2">
      <div id="task-form-container" style="display: none;" class="mb-6 p-4 bg-white rounded shadow border">
        <h2 class="text-lg font-semibold mb-3">Buat Tugas Baru</h2>
        <form id="add-task-form" class="space-y-3">
          <div>
            <label class="block text-sm font-medium">Nama Tugas</label>
            <input type="text" id="task-name" required class="w-full border rounded p-2 mt-1" />
          </div>
          <div>
            <label class="block text-sm font-medium">Deskripsi</label>
            <textarea id="task-desc" required class="w-full border rounded p-2 mt-1"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium">Deadline</label>
            <input type="date" id="task-deadline" required class="w-full border rounded p-2 mt-1" />
          </div>
          <div>
            <label class="block text-sm font-medium">Status</label>
            <select id="task-status" class="w-full border rounded p-2 mt-1">
              <option value="Completed">Completed</option>
              <option value="In-Progress">In-Progress</option>
              <option value="Pending">Pending</option>
            </select>
          </div>
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Simpan Tugas</button>
        </form>
      </div>

      <select name="task-filter" id="task-filter" class="border rounded p-1 mb-2">
        <option value="all">All Tasks</option>
        <option value="completed">Completed</option>
        <option value="in-progress">In Progress</option>
        <option value="pending">Pending</option>
      </select>
      <div class="relative w-full overflow-x-auto">
        <table class="w-full caption-bottom text-sm">
          <thead class="[&_tr]:border-b">
            <tr class="border-b transition-colors hover:bg-muted/50 has-aria-expanded:bg-muted/50 data-[state=selected]:bg-muted">
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Nama Tugas
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Deskripsi
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Deadline
              </th>
              <th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground has-[[role=checkbox]]:pr-0">
                Status
              </th>
            </tr>
          </thead>
          <tbody class="[&_tr:last-child]:border-0" id="task-table-body"></tbody>
        </table>
      </div>
    </main>
  </body>
  <script src="./scripts/task.js"></script>
</html>
