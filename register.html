<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="App for managing team, event, task, and see it's completion progress">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Team & Event Management</title>
</head>
<body>
  <header>
    <h1 class="text-xl font-bold text-center">Selamat datang!</h1>
  </header>
  <main class="flex flex-col items-center justify-center p-5">
    <form action="./dashboard.html" class="grid gap-1 w-full grid-cols-1 md:grid-cols-2">
      <label for="name">Nama</label>
      <input class="border border-gray-300 rounded py-2 px-3" type="text" id="name" name="name">
      <label for="email">Email</label>
      <input class="border border-gray-300 rounded py-2 px-3" type="email" id="email" name="email">
      <label for="password">Password</label>
      <input class="border border-gray-300 rounded py-2 px-3" type="password" id="password" name="password">
      <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 md:col-span-2">Buat akun</button>
      <p>Sudah punya akun? <a href="./login.html">masuk!</a></p>
    </form>
  </main>
</body>
</html>
