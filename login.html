<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="App for managing team, event, task, and see it's completion progress">
  <link rel="stylesheet" href="style.css">
  <title>Team & Event Management</title>
</head>
<body>
  <header>
    <h1 class="welcome-text">Selamat datang kembali!</h1>

      <p>Belum punya akun? <a href="./register.html">Buat sekarang!</a></p>
