<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="App for managing team, event, task, and see it's completion progress">
    <link rel="stylesheet" href="style.css">
    <title>Team & Event Management</title>
  </head>
  <body>
    <header><h1 class="text-lg">Dashboard</h1></header>
    <nav>
      <ul class="list">
        <li>Dashboard</li>
        <li>Anggota</li>
        <li>Event</li>
        <li>Tugas</li>
      </ul>
    </nav>
    <main class="stat-list">
      <div class="team-sum">
        <h1 class="text-lg">Nama Tim</h1>
        <p>5 Anggota</p>
      </div>
      <div class="card">
        <p>Tugas selesai</p>
        <p>5</p>
      </div>
      <div class="card">
        <p>Tugas belum selesai</p>
        <p>4</p>
      </div>
      <div class="card">
        <p>Tugas belum di assign</p>
        <p>3</p>
      </div>
      <div class="card">
        <p>Total tugas</p>
        <p>12</p>
      </div>
    </main>
  </body>
</html>
